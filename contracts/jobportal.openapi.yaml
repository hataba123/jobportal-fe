openapi: 3.1.0
info:
  title: JobPortal API
  version: 1.0.0
  description: Hợp đồng API dùng chung cho NestJS/PostgreSQL và ASP.NET Core/SQL Server.
servers:
  - url: /api
    description: Backend được chọn bởi deployment
tags:
  - name: Auth
  - name: Jobs
  - name: Companies
  - name: Applications
  - name: Interviews
  - name: Reports
  - name: Administration
  - name: Notifications
  - name: Matches
  - name: Payments
paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '200': { description: Đăng ký thành công, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: Đăng nhập thành công, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /auth/oauth-login:
    post:
      tags: [Auth]
      operationId: oauthLogin
      security: []
      parameters:
        - name: X-OAuth-Exchange-Secret
          in: header
          required: true
          schema: { type: string, writeOnly: true }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuthLoginRequest' }
      responses:
        '200': { description: Đăng nhập OAuth thành công, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200': { description: Đổi mật khẩu thành công }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string, format: email } } }
      responses:
        '200': { description: Luôn trả thông báo chung để chống dò email }
  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200': { description: Đặt lại mật khẩu thành công }
        '400': { $ref: '#/components/responses/BadRequest' }
  /jobpost:
    get:
      tags: [Jobs]
      operationId: listJobs
      security: []
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { description: Danh sách tin đang hoạt động, content: { application/json: { schema: { $ref: '#/components/schemas/PagedJobPosts' } } } }
    post:
      tags: [Jobs]
      operationId: createJob
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobPostWrite' }
      responses:
        '200': { description: Đã tạo tin, content: { application/json: { schema: { $ref: '#/components/schemas/JobPost' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /companies:
    get:
      tags: [Companies]
      operationId: listCompanies
      security: []
      responses:
        '200':
          description: Danh sách công ty đã được xác minh
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Company' } }
  /companies/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Companies]
      operationId: getCompany
      security: []
      responses:
        '200': { description: Công ty đã được xác minh, content: { application/json: { schema: { $ref: '#/components/schemas/Company' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/companies/{id}/verification:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Companies]
      operationId: updateCompanyVerification
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyVerificationUpdate' }
      responses:
        '200': { description: Đã cập nhật trạng thái xác minh, content: { application/json: { schema: { $ref: '#/components/schemas/Company' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /jobpost/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Jobs]
      operationId: getJob
      security: []
      responses:
        '200': { description: Tin tuyển dụng, content: { application/json: { schema: { $ref: '#/components/schemas/JobPost' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Jobs]
      operationId: updateJob
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobPostWrite' }
      responses:
        '200': { description: Đã cập nhật tin }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Jobs]
      operationId: deleteJob
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Đã xóa mềm tin }
        '403': { $ref: '#/components/responses/Forbidden' }
  /jobapplication:
    get:
      tags: [Applications]
      operationId: listApplications
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/SortBy' }
        - { $ref: '#/components/parameters/SortDir' }
      responses:
        '200': { description: Danh sách hồ sơ ứng tuyển, content: { application/json: { schema: { $ref: '#/components/schemas/PagedApplications' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Applications]
      operationId: applyToJob
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [jobPostId], properties: { jobPostId: { $ref: '#/components/schemas/Uuid' } } }
      responses:
        '200': { description: Đã ứng tuyển }
        '409': { description: Đã tồn tại đơn ứng tuyển }
  /jobapplication/my-jobs:
    get:
      tags: [Applications]
      operationId: listMyApplications
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { description: Hồ sơ của ứng viên hiện tại, content: { application/json: { schema: { $ref: '#/components/schemas/PagedApplications' } } } }
  /jobapplication/{id}/status:
    parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }]
    put:
      tags: [Applications]
      operationId: transitionApplication
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationTransitionRequest' }
      responses:
        '200': { description: Đã chuyển trạng thái, content: { application/json: { schema: { $ref: '#/components/schemas/Application' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /jobapplication/{id}/withdraw:
    parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }]
    post:
      tags: [Applications]
      operationId: withdrawApplication
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200': { description: Đã rút hồ sơ, content: { application/json: { schema: { $ref: '#/components/schemas/Application' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /jobapplication/{id}/history:
    get:
      tags: [Applications]
      operationId: getApplicationHistory
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Lịch sử trạng thái bất biến, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ApplicationStatusHistory' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/jobapplications/{id}/status:
    parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }]
    put:
      tags: [Administration, Applications]
      operationId: overrideApplicationStatus
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationTransitionRequest' }
      responses:
        '200': { description: Admin đã override trạng thái }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /jobapplication/{applicationId}/interviews:
    post:
      tags: [Interviews]
      operationId: scheduleInterview
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: applicationId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InterviewWrite' }
      responses:
        '201': { description: Đã lên lịch phỏng vấn, content: { application/json: { schema: { $ref: '#/components/schemas/Interview' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /interviews:
    get:
      tags: [Interviews]
      operationId: listInterviews
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { name: applicationId, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: status, in: query, schema: { type: string, enum: [Scheduled, Completed, Cancelled] } }
      responses:
        '200': { description: Lịch phỏng vấn theo quyền sở hữu, content: { application/json: { schema: { $ref: '#/components/schemas/PagedInterviews' } } } }
  /interviews/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }]
    put:
      tags: [Interviews]
      operationId: rescheduleInterview
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InterviewUpdate' }
      responses:
        '200': { description: Đã dời lịch, content: { application/json: { schema: { $ref: '#/components/schemas/Interview' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /interviews/{id}/complete:
    parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }]
    post:
      tags: [Interviews]
      operationId: completeInterview
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteInterviewRequest' }
      responses:
        '200': { description: Đã hoàn tất phỏng vấn và chuyển hồ sơ }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /interviews/{id}/cancel:
    parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }]
    post:
      tags: [Interviews]
      operationId: cancelInterview
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Đã hủy lịch phỏng vấn }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /reports:
    get:
      tags: [Reports]
      operationId: listReports
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { name: status, in: query, schema: { type: string, enum: [Pending, Resolved, Dismissed] } }
      responses:
        '200': { description: Báo cáo dành cho Admin, content: { application/json: { schema: { $ref: '#/components/schemas/PagedReports' } } } }
    post:
      tags: [Reports]
      operationId: createReport
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportWrite' }
      responses:
        '201': { description: Đã tạo báo cáo, content: { application/json: { schema: { $ref: '#/components/schemas/Report' } } } }
  /reports/{id}:
    patch:
      tags: [Reports]
      operationId: updateReport
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [status], properties: { status: { type: string, enum: [Pending, Resolved, Dismissed] } } }
      responses:
        '200': { description: Đã xử lý báo cáo }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /newsletter/subscribe:
    post:
      tags: [Administration]
      operationId: subscribeNewsletter
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Đã đăng ký newsletter }
  /newsletter/unsubscribe:
    post:
      tags: [Administration]
      operationId: unsubscribeNewsletter
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Đã hủy đăng ký newsletter }
  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Thông báo của người dùng hiện tại, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Notification' } } } } }
  /matches/jobs:
    get:
      tags: [Matches]
      operationId: listRecommendedJobs
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { name: minScore, in: query, schema: { type: integer, minimum: 0, maximum: 100, default: 0 } }
      responses:
        '200': { description: Gợi ý việc có breakdown điểm, content: { application/json: { schema: { $ref: '#/components/schemas/PagedMatches' } } } }
  /matches/job-posts/{jobPostId}/candidates:
    get:
      tags: [Matches]
      operationId: rankCandidates
      security: [{ bearerAuth: [] }]
      parameters: [{ name: jobPostId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
      responses:
        '200': { description: Ứng viên đã nộp được xếp hạng }
        '403': { $ref: '#/components/responses/Forbidden' }
  /matches/job-posts/{jobPostId}/candidates/{candidateId}:
    get:
      tags: [Matches]
      operationId: getCandidateMatch
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: jobPostId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: candidateId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '200': { description: Giải thích chi tiết điểm khớp, content: { application/json: { schema: { $ref: '#/components/schemas/MatchResult' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /plans:
    get:
      tags: [Payments]
      security: []
      responses:
        '200': { description: Gói tín dụng, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ServicePlan' } } } } }
  /payment-orders:
    post:
      tags: [Payments]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [planId], properties: { planId: { $ref: '#/components/schemas/Uuid' } } }
      responses:
        '200': { description: Đơn thanh toán chờ xử lý, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentOrder' } } } }
  /payment-orders/{id}:
    get:
      tags: [Payments]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Đơn thanh toán của người dùng hiện tại }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /payments/vnpay/return:
    get:
      tags: [Payments]
      security: []
      responses:
        '200': { description: Kết quả hiển thị từ Return URL; không cấp tín dụng }
  /payments/vnpay/ipn:
    get:
      tags: [Payments]
      security: []
      responses:
        '200': { description: IPN đã xử lý idempotent }
  /credits/balance:
    get:
      tags: [Payments]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Số dư tín dụng còn hạn }
  /credits/ledger:
    get:
      tags: [Payments]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Ledger tín dụng bất biến }
  /admin/plans:
    get:
      tags: [Payments]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Danh sách gói cho Admin }
    post:
      tags: [Payments]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServicePlanWrite' }
      responses:
        '200': { description: Đã tạo gói }
  /admin/plans/{id}:
    put:
      tags: [Payments]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServicePlanWrite' }
      responses:
        '200': { description: Đã cập nhật gói }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id: { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    SortBy: { name: sortBy, in: query, schema: { type: string } }
    SortDir: { name: sortDir, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string }, description: Opaque concurrency token từ ETag/version }
  responses:
    BadRequest: { description: Dữ liệu không hợp lệ, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: Xung đột dữ liệu, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unauthorized: { description: Chưa xác thực }
    Forbidden: { description: Không đủ quyền }
    NotFound: { description: Không tìm thấy }
    PreconditionRequired: { description: Thiếu If-Match để chống ghi đè đồng thời }
  schemas:
    Uuid: { type: string, format: uuid }
    DateTime: { type: string, format: date-time, description: UTC ISO-8601 }
    Error:
      type: object
      required: [statusCode, code, message, traceId]
      properties:
        statusCode: { type: integer }
        code: { type: string }
        message: { type: string }
        traceId: { type: string }
        details: { type: object, additionalProperties: true }
    RegisterRequest:
      type: object
      required: [email, password, fullName]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, writeOnly: true }
        fullName: { type: string }
        role: { type: integer, enum: [1, 2], default: 2, description: 1=Recruiter, 2=Candidate; Admin chỉ được tạo bởi Admin đã xác thực }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, writeOnly: true }
    OAuthLoginRequest:
      type: object
      required: [provider, accessToken]
      properties:
        provider: { type: string, enum: [google, facebook, github] }
        accessToken: { type: string, writeOnly: true }
        idToken: { type: string, writeOnly: true }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, writeOnly: true }
        newPassword: { type: string, minLength: 8, writeOnly: true }
    ResetPasswordRequest:
      type: object
      required: [email, token, newPassword]
      properties:
        email: { type: string, format: email }
        token: { type: string, writeOnly: true }
        newPassword: { type: string, minLength: 8, writeOnly: true }
    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string, writeOnly: true }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      required: [id, email, fullName, role]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        email: { type: string, format: email }
        fullName: { type: string }
        role: { type: integer, enum: [0, 1, 2] }
    JobPostWrite:
      type: object
      required: [title, description, location, salary, categoryId]
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string }
        location: { type: string }
        salary: { type: number }
        skillsRequired: { type: string }
        type: { type: string }
        tags: { type: array, items: { type: string } }
